# Tests the Tart agent's installer (scripts/install-tart-agent.sh) with
# scripts/test-install-tart-agent.sh on the macOS runner, where zsh, BSD sed
# and the system python3 are the real ones. The test stubs uname, stat, cargo,
# plutil and launchctl, so nothing is built, installed or started, and the job
# needs no Rust.
#
# The same job tests the GitLab and Bitbucket Tart image preparation scripts
# (scripts/prepare-tart-gitlab-runner-image.sh and
# scripts/prepare-tart-bitbucket-runner-image.sh, #173) with
# scripts/test-prepare-tart-runner-images.sh, under the system /bin/bash (3.2
# on macOS). A fake tart stands in, so no VM boots.
#
# It runs only when a change can affect what the tests check: the installer,
# its plist template, the two image scripts, the tests themselves, the Tart
# agent crate, or this workflow.
# A `paths` filter does that without starting any job, so a change elsewhere
# costs no runner and no macOS VM. (A changed-files step would need a Linux job
# on every push just to decide; it would be the better choice only if this
# check were ever made required, since a required check whose workflow did not
# run stays pending. Nothing requires it today.)
name: Tart installer

on:
  push:
    branches:
      - master
    paths:
      - scripts/install-tart-agent.sh
      - scripts/test-install-tart-agent.sh
      - scripts/prepare-tart-gitlab-runner-image.sh
      - scripts/prepare-tart-bitbucket-runner-image.sh
      - scripts/test-prepare-tart-runner-images.sh
      - deploy/launchd/dev.gridops.tart-agent.plist
      - crates/gridops-tart-agent/**
      - .github/workflows/tart-installer.yml
  pull_request:
    branches:
      - master
    paths:
      - scripts/install-tart-agent.sh
      - scripts/test-install-tart-agent.sh
      - scripts/prepare-tart-gitlab-runner-image.sh
      - scripts/prepare-tart-bitbucket-runner-image.sh
      - scripts/test-prepare-tart-runner-images.sh
      - deploy/launchd/dev.gridops.tart-agent.plist
      - crates/gridops-tart-agent/**
      - .github/workflows/tart-installer.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tart-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tart installer and image preparation tests (macOS)
    # Like ci.yml: a trusted run (push, dispatch, or a pull request from a
    # branch of this repo whose author is in the org variable
    # TRUSTED_CI_AUTHORS) uses the runner the release's macOS agent job uses, a
    # Tart VM guest started by GridOps (docs/macos-runners.md) or a Mac. Any
    # other pull request runs on a GitHub-hosted macOS runner (free for this
    # public repo).
    runs-on: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON(vars.TRUSTED_CI_AUTHORS || '[]'), github.event.pull_request.user.login))) && fromJSON('["self-hosted","macOS","ARM64"]') || 'macos-latest' }}
    timeout-minutes: 15
    steps:
      # The test skips (and exits 0) without zsh or python3. Here that would be
      # a broken runner, not a reason to pass, so say what is missing instead.
      # python3 must be able to read plists: without the Xcode command line
      # tools /usr/bin/python3 is only a stub.
      - name: Check the runner
        timeout-minutes: 5
        run: |
          fail() { echo "::error::$*"; exit 1; }
          sw_vers
          [ "$(uname -s)" = Darwin ] || fail "not macOS: $(uname -s)"
          command -v zsh >/dev/null || fail "zsh is missing"
          command -v python3 >/dev/null || fail "python3 is missing"
          [ -x /bin/bash ] || fail "/bin/bash is missing"
          python3 -I -c 'import plistlib' || fail "python3 cannot run: install the Xcode command line tools, or use a Tart base image that has them"
          zsh --version
          python3 --version
          /bin/bash --version | head -n 1

      - name: Check out repository
        uses: actions/checkout@v5
        timeout-minutes: 5

      # Passes only on the test's own "all passed" as its last line, so a skip
      # (which also exits 0) fails the job.
      - name: Test the Tart installer
        timeout-minutes: 5
        run: |
          status=0
          out="$(sh scripts/test-install-tart-agent.sh 2>&1)" || status=$?
          printf '%s\n' "$out"
          [ "$status" = 0 ] || { echo "::error::scripts/test-install-tart-agent.sh failed (exit $status)"; exit 1; }
          if [ "$(printf '%s\n' "$out" | tail -n 1)" != "all passed" ]; then
            echo "::error::scripts/test-install-tart-agent.sh did not run its checks: $(printf '%s\n' "$out" | tail -n 1)"
            exit 1
          fi

      # The same rule: only the test's own "all passed" as its last line passes.
      - name: Test the GitLab and Bitbucket Tart image preparation
        timeout-minutes: 5
        run: |
          status=0
          out="$(sh scripts/test-prepare-tart-runner-images.sh 2>&1)" || status=$?
          printf '%s\n' "$out"
          [ "$status" = 0 ] || { echo "::error::scripts/test-prepare-tart-runner-images.sh failed (exit $status)"; exit 1; }
          if [ "$(printf '%s\n' "$out" | tail -n 1)" != "all passed" ]; then
            echo "::error::scripts/test-prepare-tart-runner-images.sh did not run its checks: $(printf '%s\n' "$out" | tail -n 1)"
            exit 1
          fi
