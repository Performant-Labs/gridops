name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# Tolerate a flaky network. Every value is a ceiling on retrying; a healthy
# network never reaches it.
#  - CARGO_NET_RETRY (cargo's net.retry, default 3): how often cargo retries a
#    possibly spurious network error, such as a failed crates.io download.
#  - npm_config_fetch_retries (npm's fetch-retries, default 2): how often npm
#    retries a failed registry fetch; its retry delays and timeouts stay default.
env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  npm_config_fetch_retries: 5

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web build, lint, and tests
    # Trusted runs use the self-hosted fleet; the rest use GitHub-hosted runners
    # (free for this public repo). Trusted: a push or dispatch (only
    # collaborators can trigger those), or a pull request from a branch of this
    # repo whose author is in the org variable TRUSTED_CI_AUTHORS (a JSON list
    # of logins). A fork pull request, or any pull request while that variable
    # is unset, runs hosted.
    runs-on: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON(vars.TRUSTED_CI_AUTHORS || '[]'), github.event.pull_request.user.login))) && 'self-hosted-linux' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        timeout-minutes: 5

      # The self-hosted image carries Node 22; a hosted runner may not.
      - name: Set up Node.js (hosted runner only)
        if: runner.environment == 'github-hosted'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Node.js toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        timeout-minutes: 10
        run: npm ci --no-audit --no-fund

      - name: Build application
        run: npm run build

      - name: Lint application
        run: npm run lint

      - name: Run application tests
        run: npm test

      - name: Test the build number script
        run: sh scripts/test-build-info.sh

      - name: Test the fleet health guard
        run: node --test scripts/fleet-health-guard.test.mjs

  fleet-health-guard:
    name: Fleet health guard
    # #197: a pull request that closes a wave-1 fleet health issue (epic #198)
    # may change only that issue's files, and may only remove its own markers
    # from the contract tests (docs/design/fleet-health-owners.json). A pull
    # request that closes none of them passes. It reads the pull request's
    # changed files from the GitHub API and runs no code from the branch but
    # the guard itself; the same runner rule as the web job.
    if: github.event_name == 'pull_request'
    runs-on: ${{ (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON(vars.TRUSTED_CI_AUTHORS || '[]'), github.event.pull_request.user.login)) && 'self-hosted-linux' || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        timeout-minutes: 5

      - name: Set up Node.js (hosted runner only)
        if: runner.environment == 'github-hosted'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the guard
        run: node --test scripts/fleet-health-guard.test.mjs

      # The rules come from the base branch, not the pull request: a pull request must not be able
      # to loosen its own guard by editing the script or the owners file. Both are read from the
      # base commit into a scratch directory and run from there (the script finds the owners file
      # relative to itself). The one exception is the pull request that adds the guard (#197),
      # whose base has none yet; every wave-1 pull request is cut after it lands.
      - name: Read the guard's rules from the base branch
        id: base-guard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          dir="$RUNNER_TEMP/fleet-health-guard"
          mkdir -p "$dir/scripts" "$dir/docs/design"
          if git cat-file -e "$BASE_SHA:scripts/fleet-health-guard.mjs" 2>/dev/null \
            && git cat-file -e "$BASE_SHA:docs/design/fleet-health-owners.json" 2>/dev/null; then
            git show "$BASE_SHA:scripts/fleet-health-guard.mjs" > "$dir/scripts/fleet-health-guard.mjs"
            git show "$BASE_SHA:docs/design/fleet-health-owners.json" > "$dir/docs/design/fleet-health-owners.json"
            echo "script=$dir/scripts/fleet-health-guard.mjs" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The base branch has no fleet health guard yet; using this pull request's copy (only the pull request that adds it)."
            echo "script=scripts/fleet-health-guard.mjs" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the pull request's files
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GUARD_SCRIPT: ${{ steps.base-guard.outputs.script }}
        run: node "$GUARD_SCRIPT"

  rust:
    name: Rust format, lint, and tests
    # The same runner rule as the web job, but the trusted label is
    # self-hosted-linux-fast: the full Rust build takes about 28 minutes on the
    # slow light pool and hits the 30 minute timeout (#134).
    runs-on: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON(vars.TRUSTED_CI_AUTHORS || '[]'), github.event.pull_request.user.login))) && 'self-hosted-linux-fast' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        timeout-minutes: 5

      # A hosted runner gets the Rust the self-hosted image carries (1.98.1,
      # printed by the step below on that image), not the newest stable: a
      # newer clippy brings new lints that fail `-D warnings` on code the
      # fleet passes. Move this with the image.
      - name: Set up Rust (hosted runner only)
        if: runner.environment == 'github-hosted'
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1

      - name: Verify Rust toolchain
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Test the installer
        run: sh scripts/test-install.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        # The shared runner image carries a newer Rust than the old gridops-ci
        # image did. Its unused_async_trait_impl lint flags trait impls whose
        # signature the trait dictates, so it is allowed rather than rewritten.
        run: cargo clippy --workspace --all-targets --locked -- -D warnings -A clippy::unused_async_trait_impl

      - name: Run Rust tests
        run: cargo test --workspace --locked

      # The Rust tests build without a number. This checks the path a numbered build takes: the environment reaches the binary.
      - name: Check the build number reaches the agent
        run: |
          out="$(GRIDOPS_BUILD_NUMBER=4242 GRIDOPS_COMMIT=abcdef0 cargo run --quiet --locked -p gridops-host-agent -- --version)"
          echo "$out"
          case "$out" in *"+build.4242 (abcdef0)") ;; *) echo "the agent does not report the build number"; exit 1 ;; esac
