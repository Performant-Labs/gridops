name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web build, lint, and tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted-linux]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify Node.js toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build application
        run: npm run build

      - name: Lint application
        run: npm run lint

      - name: Run application tests
        run: npm test

      - name: Test the build number script
        run: sh scripts/test-build-info.sh

  rust:
    name: Rust format, lint, and tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted-linux]
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify Rust toolchain
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Test the installer
        run: sh scripts/test-install.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        # The shared runner image carries a newer Rust than the old gridops-ci
        # image did. Its unused_async_trait_impl lint flags trait impls whose
        # signature the trait dictates, so it is allowed rather than rewritten.
        run: cargo clippy --workspace --all-targets --locked -- -D warnings -A clippy::unused_async_trait_impl

      - name: Run Rust tests
        run: cargo test --workspace --locked

      # The Rust tests build without a number. This checks the path a numbered build takes: the environment reaches the binary.
      - name: Check the build number reaches the agent
        run: |
          out="$(GRIDOPS_BUILD_NUMBER=4242 GRIDOPS_COMMIT=abcdef0 cargo run --quiet --locked -p gridops-host-agent -- --version)"
          echo "$out"
          case "$out" in *"+build.4242 (abcdef0)") ;; *) echo "the agent does not report the build number"; exit 1 ;; esac
