# Manually triggered check that a fleet machine can run a job end to end.
# Runs on runners from a pool whose fleet profile adds the
# `gridops-fleet-test` label.
name: Fleet smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, gridops-fleet-test]
    timeout-minutes: 10
    steps:
      # Expressions keep this working in bash and PowerShell alike.
      - name: Report the runner
        run: echo "Runner ${{ runner.name }} (${{ runner.os }}/${{ runner.arch }})"
