# Manually triggered check that a fleet machine can run a job end to end.
# Runs on any Linux runner a GridOps pool launched (every GridOps pool carries
# the `gridops` label), as opposed to a legacy compose runner.
name: Fleet smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted-linux, gridops]
    timeout-minutes: 10
    steps:
      # Expressions keep this working in bash and PowerShell alike.
      - name: Report the runner
        run: echo "Runner ${{ runner.name }} (${{ runner.os }}/${{ runner.arch }})"
