# .agents/pr-review.yml — PR automation config for GridOps
# Read by: .github/workflows/pr-review.yml (CI), via the vendored ./.github/workflows/pr-review-reusable.yml.
#
# This repo runs the playbook's DEFAULT reviewer: PR-Agent through the Claude Code
# CLI (akalongman/pr-agent-cli-handlers), authenticated by the CLAUDE_CODE_OAUTH_TOKEN
# secret. It deliberately sets NO model keys: every model is the playbook's default.
# Claude is wanted here on purpose: much of the code is written by GLM agents, and a
# review by a different model is more independent than one by the same model.
#
# Reference: playbook pipelines/pr-reviewer/README.md, "Config reference".

project:
  name: "gridops"
  timezone: "America/Los_Angeles"

pr_agent:
  high_stakes_label: "high-stakes"
  skip_docs_only: false
  score_labels: true
  score_banner: true
  status_check: true
