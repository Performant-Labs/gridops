# .agents/pr-review.yml — PR automation config for GridOps
# Read by: .github/workflows/pr-review.yml (CI), via the vendored ./.github/workflows/pr-review-reusable.yml.
#
# This repo runs PR-Agent on GLM 5.4 through the z.ai coding endpoint (the ZAI_API_KEY
# secret), with glm-5.3 as the fallback. pr-review.yml passes no CLAUDE_CODE_OAUTH_TOKEN,
# so the workflow takes its API path. It used the Claude Code CLI before (2026-11-24): the
# Claude subscription's weekly limit blocked every review until it reset. Most new code is
# now written by Claude agents, so a GLM review is the independent one; if GLM agents write
# the code again, consider switching the reviewer back.
#
# Reference: playbook pipelines/pr-reviewer/README.md, "Config reference".

project:
  name: "gridops"
  timezone: "America/Los_Angeles"

pr_agent:
  model: "openai/glm-5.4"
  fallback_model: "openai/glm-5.3"
  high_stakes_label: "high-stakes"
  skip_docs_only: false
  score_labels: true
  score_banner: true
  status_check: true
