[package]
name = "gridops-reconciler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# #204: the fleet health passes as a library (`src/lib.rs`), so
# `gridops-api`'s end-to-end test runs the passes the reconciler runs. The
# binary compiles the same modules as its own and tests them there, so the
# library's copy is not tested twice.
[lib]
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "gridops-reconciler"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
futures-util.workspace = true
gridops-agent = { path = "../gridops-agent" }
gridops-core = { path = "../gridops-core" }
hex.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
axum.workspace = true
# `gitlab::fake::FakeGitLab` drives the GitLab poll tests (#148) and the
# GitLab lifecycle tests (#139).
gridops-core = { path = "../gridops-core", features = ["test-support"] }
rsa = { version = "0.9", features = ["getrandom"] }

[lints]
workspace = true
